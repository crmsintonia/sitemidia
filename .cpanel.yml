---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/MIDIA031.COM.BR/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -f index.html $DEPLOYPATH 2>/dev/null || true
    - /bin/bash -c 'shopt -s nullglob; for f in *.css *.js; do cp -f "$f" "$DEPLOYPATH"; done'
    - /bin/cp -f .htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/bash -c 'if [ -d assets ]; then cp -r assets "$DEPLOYPATH"; fi'
